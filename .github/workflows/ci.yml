name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Build does not require real env vars — Next.js builds with empty values
      # and our app gracefully degrades when DEEPSEEK_API_KEY / Supabase vars
      # are missing at runtime.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
