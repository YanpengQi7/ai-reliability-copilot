name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Pure-function unit tests (control gate, alert parsers, cost, secret scan,
      # rubric). Deterministic and offline — no API keys, no DB, no LLM calls.
      - name: Unit tests
        run: npm test

      - name: Validate evaluation candidates
        run: npm run evals:v2 -- validate

      - name: Validate adversarial challenge candidates
        run: npm run evals:v2 -- validate --dataset=evals/datasets/sre-v2/challenges.json

      - name: Exercise offline replay, resume and fixed-answer calibration
        run: |
          npm run evals:v2 -- run --id=ci-challenges --mock --dataset=evals/datasets/sre-v2/challenges.json --limit=6
          npm run evals:v2 -- run --id=ci-offline --mock --limit=2
          npm run evals:v2 -- generate --id=ci-offline --mock
          npm run evals:v2 -- score --id=ci-offline --judge-run=replay
          npm run evals:v2 -- calibrate --id=ci-offline --judge-run=calibration
          npm run evals:v2 -- report --id=ci-offline --judge-run=replay

      - name: Upload offline evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation
          path: |
            evals/runs/ci-offline/
            evals/runs/ci-challenges/
          if-no-files-found: warn
          retention-days: 14

      # Build does not require real env vars — Next.js builds with empty values
      # and our app gracefully degrades when DEEPSEEK_API_KEY / Supabase vars
      # are missing at runtime.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
